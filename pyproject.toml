[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "privet"
version = "2.0.0"
description = "PRIVET: sample-level privacy audit of synthetic data with extreme value theory on nearest-neighbour distances"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Antoine Szatkownik" }]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "numba>=0.56",
    "torch>=1.12",
    "pandas>=1.5",
    "matplotlib>=3.5",
]

[project.scripts]
privet = "privet.cli:main"

[project.urls]
Repository = "https://github.com/antoineszatkownik/PRIVET"

[tool.setuptools.packages.find]
include = ["privet", "privet.*"]
